<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In — Sakada Logistics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800;900&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-card">
        <a class="logo" href="../index.html"
          >SAKA<span class="mark">DA</span></a
        >
        <h1>Welcome back</h1>
        <p class="auth-sub">Log in to book, track, or manage deliveries.</p>

        <div id="formMessage" class="form-message" role="alert"></div>

        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              required
              autocomplete="current-password"
            />
          </div>
          <button class="btn-primary" type="submit" id="submitBtn">
            Log In
          </button>
        </form>

        <div class="auth-divider">or</div>

        <button class="google-btn" id="googleBtn" type="button">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
            <path
              fill="#4285F4"
              d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9C16.66 14.2 17.64 11.9 17.64 9.2z"
            />
            <path
              fill="#34A853"
              d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"
            />
            <path
              fill="#FBBC05"
              d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"
            />
            <path
              fill="#EA4335"
              d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"
            />
          </svg>
          Continue with Google
        </button>

        <p class="auth-footer-link">
          New here? <a href="register.html">Create an account</a>
        </p>
        <p class="admin-note">
          Are you an admin? <a href="admin-login.html">Admin login</a>
        </p>
      </div>
    </main>

    <script type="module">
      import {
        loginWithEmail,
        loginWithGoogle,
        getCurrentProfile,
      } from "../js/auth.js";

      const DASHBOARD_PATHS = {
        farmer: "../dashboard/farmer/index.html",
        vendor: "../dashboard/vendor/index.html",
        driver: "../dashboard/driver/index.html",
        admin: "../dashboard/admin/index.html",
      };

      const messageEl = document.getElementById("formMessage");
      function showMessage(text, type) {
        messageEl.textContent = text;
        messageEl.className = `form-message visible ${type}`;
      }

      const form = document.getElementById("loginForm");
      const submitBtn = document.getElementById("submitBtn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { error } = await loginWithEmail({ email, password });

        if (error) {
          submitBtn.disabled = false;
          submitBtn.textContent = "Log In";
          showMessage(error.message, "error");
          return;
        }

        const profile = await getCurrentProfile();
        window.location.href =
          DASHBOARD_PATHS[profile?.role] || "../index.html";
      });

      document
        .getElementById("googleBtn")
        .addEventListener("click", async () => {
          const { error } = await loginWithGoogle();
          if (error) showMessage(error.message, "error");
        });
    </script>
  </body>
</html>
