<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — Sakada Logistics</title>
    <meta name="robots" content="noindex" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://api.mapbox.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com wss://*.supabase.co; frame-src 'none';" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800;900&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <main class="auth-page" id="main">
      <div class="auth-card">
        <a class="logo" href="../index.html"
          >SAKA<span class="mark">DA</span></a
        >
        <h1>Admin Portal</h1>
        <p class="auth-sub">
          Restricted access. Admin accounts are not self-registered.
        </p>

        <div id="formMessage" class="form-message" role="alert"></div>

        <form id="adminLoginForm">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              type="password"
              required
              autocomplete="current-password"
            />
          </div>
          <button class="btn-primary" type="submit" id="submitBtn">
            Log In
          </button>
        </form>

        <p class="auth-footer-link">
          <a href="login.html">Back to regular login</a>
        </p>
      </div>
    </main>

    <script type="module" src="../js/admin-login.js"></script>
  </body>
</html>
